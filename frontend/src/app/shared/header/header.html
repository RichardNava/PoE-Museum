<header class="navbar">
  <div class="navbar-left">
    <div class="logo">
      <img src="assets/logo.png" alt="PoE Museum" />
      <span class="logo-text">PoE Museum</span>
    </div>
  </div>
  
  <nav class="navbar-center">
    <ul class="nav-links">
      <li><a href="#" class="nav-link active"><i class="fas fa-layer-group"></i> Galería</a></li>
      <li><a href="#" class="nav-link"><i class="fas fa-plus-circle"></i> Crear Build</a></li>
      <li><a href="#" class="nav-link"><i class="fas fa-user"></i> Perfil</a></li>
    </ul>
  </nav>
  
  <div class="navbar-right">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Buscar builds..." />
    </div>
    
    <div class="user-menu">
      <div class="user-icon" (click)="toggleMenu()">
        <i class="fas fa-user"></i>
      </div>
      <div class="dropdown-menu" [class.active]="isMenuOpen">
        <a href="#" class="dropdown-item"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</a>
        <a href="#" class="dropdown-item"><i class="fas fa-user-plus"></i> Crear Perfil</a>
        <div class="dropdown-divider"></div>
        <a href="#" class="dropdown-item"><i class="fas fa-cog"></i> Configuración</a>
      </div>
    </div>
  </div>
</header>
