<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PoE Museum icon - reliquia">
  <defs>
    <!-- Bronce envejecido -->
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f0e2"></stop>
      <stop offset="35%" stop-color="#d4b27a"></stop>
      <stop offset="70%" stop-color="#9a6d3a"></stop>
      <stop offset="100%" stop-color="#f6f0e2"></stop>
    </linearGradient>

    <!-- Pátina verdosa -->
    <radialGradient id="patina" cx="46%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7cc7b1" stop-opacity="0.16"></stop>
      <stop offset="45%" stop-color="#2f8a79" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Brasa suave (menos “infernal”, más reliquia) -->
    <radialGradient id="emberSoft" cx="50%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#ffb24a" stop-opacity="0.22"></stop>
      <stop offset="55%" stop-color="#ff6a2a" stop-opacity="0.10"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <!-- Medallón -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#120e12" stroke-width="18"></circle>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#bronze)" stroke-width="10"></circle>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a1b14" stroke-opacity="0.85" stroke-width="6"></circle>

  <!-- Motivo “grabado” (4 muescas) -->
  <g fill="#2a1b14" opacity="0.75">
    <path d="M256 66 l18 28 h-36 Z"></path>
    <path d="M256 446 l18 -28 h-36 Z"></path>
    <path d="M66 256 l28 18 v-36 Z"></path>
    <path d="M446 256 l-28 18 v-36 Z"></path>
  </g>

  <!-- Remaches -->
  <g fill="#9a6d3a" opacity="0.95">
    <circle cx="256" cy="66" r="7"></circle>
    <circle cx="256" cy="446" r="7"></circle>
    <circle cx="66" cy="256" r="7"></circle>
    <circle cx="446" cy="256" r="7"></circle>
  </g>

  <!-- Pátina + brasa -->
  <circle cx="256" cy="256" r="160" fill="url(#patina)"></circle>
  <circle cx="256" cy="256" r="145" fill="url(#emberSoft)"></circle>

  <!-- Templo “reliquia” (más macizo) -->
  <g>
    <path d="M256 148 L166 205 L346 205 Z" fill="url(#bronze)"></path>
    <rect x="178" y="205" width="156" height="14" rx="3" fill="url(#bronze)"></rect>

    <!-- Columnas más “antiguas” -->
    <g fill="url(#bronze)">
      <rect x="198" y="225" width="26" height="124" rx="7"></rect>
      <rect x="243" y="225" width="26" height="124" rx="7"></rect>
      <rect x="288" y="225" width="26" height="124" rx="7"></rect>
      <rect x="186" y="349" width="140" height="24" rx="9"></rect>
    </g>

    <!-- Grabado central (runa más sutil) -->
    <path d="M256 262
             C240 262 230 276 230 292
             L230 350
             L282 350
             L282 292
             C282 276 272 262 256 262 Z" fill="#0a0a0f" opacity="0.95"></path>

    <path d="M256 282 L270 306 L256 330 L242 306 Z" fill="#ffb24a" opacity="0.75"></path>
    <path d="M256 276 L256 336" stroke="#d4b27a" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"></path>
  </g>
</svg>